name: PinePhone Pro image

on:
  workflow_dispatch:
    inputs:
      compress_level:
        description: "Nivel zstd (1-19)"
        required: false
        default: "12"
  push:
    tags:
      - "pinephonepro-v*"

permissions:
  contents: read

concurrency:
  group: pinephonepro-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            podman \
            zstd \
            qemu-utils \
            qemu-system-arm \
            qemu-efi-aarch64 \
            sshpass \
            dosfstools \
            e2fsprogs \
            mtools \
            rsync \
            debian-archive-keyring \
            ubuntu-keyring \
            dnf

          command -v podman
          command -v sshpass
          command -v rsync
          command -v qemu-system-aarch64

      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 2>/dev/null || true

          echo "userns restrict: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo 'n/a')"

      - name: Bootstrap build trees
        run: |
          bash packaging/pipeline-patches/bootstrap.sh "$HOME/.cache/marathon-build"

      - name: Apply PinePhone Pro pipeline changes
        run: |
          set -euo pipefail
          # Pipeline patch 0060, as an idempotent script: it edits the freshly
          # bootstrapped duranium tree (U-Boot boot path, boot partition at
          # sector 32768, DTBs under rockchip/). It stops if an anchor is missing.
          python3 scripts/ci/apply-ppp-pipeline.py "$HOME/.cache/marathon-build/duranium"

      - name: Pin mkosi tools tree to Fedora
        run: |
          mkdir -p "$HOME/.cache/marathon-build/duranium/mkosi.conf.d"

          cat > "$HOME/.cache/marathon-build/duranium/mkosi.conf.d/10-ci-tools-tree.conf" <<'EOF'
          [Build]
          ToolsTreeDistribution=fedora
          EOF

          sed -i 's/^          //' \
            "$HOME/.cache/marathon-build/duranium/mkosi.conf.d/10-ci-tools-tree.conf"

          cat "$HOME/.cache/marathon-build/duranium/mkosi.conf.d/10-ci-tools-tree.conf"

      - name: Prepare device secrets
        env:
          MARATHON_WIFI_NMCONNECTION_B64: ${{ secrets.MARATHON_WIFI_NMCONNECTION_B64 }}
          MARATHON_DEV_SSH_KEY: ${{ secrets.MARATHON_DEV_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.marathon-secrets"
          chmod 700 "$HOME/.marathon-secrets"

          if [ -z "$MARATHON_WIFI_NMCONNECTION_B64" ]; then
            echo "Missing repository secret: MARATHON_WIFI_NMCONNECTION_B64" >&2
            exit 1
          fi

          if [ -z "$MARATHON_DEV_SSH_KEY" ]; then
            echo "Missing repository secret: MARATHON_DEV_SSH_KEY" >&2
            exit 1
          fi

          printf '%s' "$MARATHON_WIFI_NMCONNECTION_B64" \
            | base64 -d \
            > "$HOME/.marathon-secrets/SKYZMTGV.nmconnection.raw"

          chmod 600 "$HOME/.marathon-secrets/SKYZMTGV.nmconnection.raw"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$MARATHON_DEV_SSH_KEY" \
            > "$HOME/.ssh/id_ed25519.pub"

          chmod 600 "$HOME/.ssh/id_ed25519.pub"

      - name: Restore APK cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/marathon-build/duranium/mkosi.packages
          key: ppp-apks-v2-${{ github.run_id }}
          restore-keys: |
            ppp-apks-v2-

      - name: Rebuild the device overlay APK every run
        run: |
          # build_if_missing reuses an APK with the same name; the overlay is
          # small and changes often, so never take it from the cache.
          rm -f "$HOME"/.cache/marathon-build/duranium/mkosi.packages/device-pine64-pinephonepro-marathon-*.apk
          ls -lh "$HOME/.cache/marathon-build/duranium/mkosi.packages/" 2>/dev/null || true

      - name: Build PinePhone Pro image
        env:
          MARATHON_DEV_SSH_KEY: ${{ secrets.MARATHON_DEV_SSH_KEY }}
        run: |
          set -euo pipefail
          bash ./scripts/build-pinephonepro-image.sh

      - name: Save APK cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/marathon-build/duranium/mkosi.packages
          key: ppp-apks-v2-${{ github.run_id }}

      - name: Locate image
        id: locate
        run: |
          set -euo pipefail

          # The whole-disk image only: mkosi also leaves split partitions next
          # to it (<name>.root-arm64.<hash>.raw, <name>.esp.raw), which must
          # never be flashed to a card.
          img="$(
            find "$HOME/.cache/marathon-build/duranium/mkosi.output" \
              -regextype posix-extended \
              -regex '.*/pine64-pinephonepro_marathon_edge_[0-9]+\.raw' \
              -type f \
              -printf '%T@ %p\n' \
            | sort -nr \
            | head -1 \
            | cut -d' ' -f2-
          )"

          if [ -z "$img" ]; then
            echo "No whole-disk PinePhone Pro .raw image was produced." >&2
            find "$HOME/.cache/marathon-build/duranium/mkosi.output" -maxdepth 3 -type f | head -100 >&2
            exit 1
          fi

          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "Found image: $img"
          ls -lh "$img"

      - name: Verify the PinePhone Pro disk layout
        run: |
          set -euo pipefail
          img="${{ steps.locate.outputs.image }}"

          at()  { dd if="$img" bs=1 skip="$1" count="$2" status=none | tr -d '\000'; }
          hex() { od -An -tx1 | tr -d ' \n'; }
          raw() { dd if="$img" bs=1 skip="$1" count="$2" status=none | od -An -tx1 | tr -d ' \n'; }
          fail() {
            echo "layout check failed: $*" >&2
            sfdisk -d "$img" >&2 || true
            exit 1
          }

          # Always show what is there, so a failure can be diagnosed from the log.
          echo "bytes at 32 KiB (idbloader):   $(raw 32768 16)"
          echo "bytes at 8 MiB  (u-boot.itb):  $(raw 8388608 16)"

          [ "$(at 510 2 | hex)" = "55aa" ] || fail "no protective MBR signature"
          [ "$(at 512 8)" = "EFI PART" ]   || fail "no GPT"

          # The Rockchip boot ROM header is RC4-encrypted, so a valid idbloader
          # starts with 3b8cdcfc (the "RK33" text sits further in). Fail only if
          # nothing at all was written there; warn on an unknown header.
          nonzero=$(dd if="$img" bs=1 skip=32768 count=512 status=none | tr -d '\000' | wc -c)
          [ "$nonzero" -gt 0 ] || fail "nothing written at 32 KiB: the U-Boot blob is missing"
          case "$(raw 32768 4)" in
            3b8cdcfc|524b3333) echo "idbloader header recognised" ;;
            *) echo "::warning::unknown header at 32 KiB ($(raw 32768 4)); expected a Rockchip idbloader (3b8cdcfc)" ;;
          esac

          [ "$(raw 8388608 4)" = "d00dfeed" ] || fail "no FIT image (u-boot.itb) at 8 MiB"

          sfdisk -J "$img" | python3 -c '
          import json, sys
          parts = json.load(sys.stdin)["partitiontable"]["partitions"]
          sys.exit(0 if parts[0]["start"] == 32768 else 1)
          ' || fail "partition 1 does not start at sector 32768"

          echo "layout OK: GPT, idbloader at 32 KiB, u-boot.itb at 8 MiB, boot partition at sector 32768"
          sfdisk -d "$img"

      - name: Compress image
        if: ${{ always() && steps.locate.outputs.image != '' }}
        env:
          ZSTD_LEVEL: ${{ inputs.compress_level || '12' }}
        run: |
          set -euo pipefail

          mkdir -p release
          name="pinephonepro-marathon-edge-${GITHUB_RUN_ID}.raw.zst"

          zstd "-${ZSTD_LEVEL}" -T0 \
            -o "release/$name" \
            "${{ steps.locate.outputs.image }}"

          sha256sum "release/$name" > "release/$name.sha256"

          size="$(stat -c%s "release/$name")"
          echo "Compressed size: $(numfmt --to=iec "$size")"

          if [ "$size" -gt 2000000000 ]; then
            echo "Image exceeds GitHub's 2 GB release-asset limit." >&2
            exit 1
          fi

          ls -lh release/

      - name: Upload image artifact
        if: ${{ always() && steps.locate.outputs.image != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pinephonepro-marathon-image
          path: |
            release/*.raw.zst
            release/*.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/pinephonepro-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.raw.zst
            release/*.sha256
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
